<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  />

  <title>Email Verification | Spotlight</title>

  <link rel="stylesheet" href="theme.css">


  <meta property="og:type" content="business.business" />
  <meta property="og:title" content="Vendor Profile on Spotlight" />
  <meta property="og:description" content="Verified business profile on Spotlight." />
  <meta property="og:image" content="https://yourdomain.com/images/og-default.png" />
  <meta property="og:url" content="" id="ogUrl" />


  <!-- SEO placeholders -->
  <meta name="description" content="Discover verified vendors near you on Spotlight." />
  <link rel="canonical" href="https://www.spotlightdirectories.com/vendor-profile" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>  

  <style>

    body {

      font-family:
        system-ui,
        sans-serif;

      background:
        #f8fafc;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        100vh;

      margin: 0;

      padding: 20px;

    }

    .verify-card {

      background:
        #fff;

      padding:
        40px;

      border-radius:
        16px;

      max-width:
        500px;

      width:
        100%;

      text-align:
        center;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.08);

    }

    h1 {

      margin-bottom:
        10px;

    }

    p {

      color:
        #475569;

      line-height:
        1.6;

    }

    .success {

      color:
        #16a34a;

      font-weight:
        700;

    }

    .error {

      color:
        #dc2626;

      font-weight:
        700;

    }

  </style>

</head>

<body>

  <div class="verify-card">

    <h1>Email Verification</h1>

    <p id="verifyMessage">
      Verifying your email...
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-client.js"></script>

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const supabase =
          window.supabaseClient;

const params =
  new URLSearchParams(
    window.location.search
  );

const code =
  params.get("code");

if (code) {

  await supabase.auth.exchangeCodeForSession(
    code
  );

}

        const message =
          document.getElementById(
            "verifyMessage"
          );

        try {

      const {
  data: { session },
  error
} = await supabase.auth.getSession();

if (
  error ||
  !session?.user
) {

  message.textContent =
    "Invalid or expired verification link.";

  message.className =
    "error";

  return;

}

const user =
  session.user;

const {
  error: vendorError
} = await supabase
  .from("vendors")
  .update({
    email_verified: true
  })
  .eq(
    "auth_user_id",
    user.id
  );

if (vendorError) {

  message.textContent =
    "Unable to verify email.";

  message.className =
    "error";

  return;

}

message.textContent =
  "Your email has been verified successfully.";

message.className =
  "success";

// Refresh auth session
await supabase.auth.refreshSession();

// Redirect owner back to dashboard
setTimeout(() => {

  window.location.href =
    "vendordashboard.html";

}, 1500);

  
        } catch (err) {

          console.error(err);

          message.textContent =
            "Verification failed.";

          message.className =
            "error";

        }

      }
    );

  </script>

</body>
</html>
