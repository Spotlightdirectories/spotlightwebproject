<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Email Verification | Spotlight</title>

  <link rel="stylesheet" href="theme.css">

  <style>

    body {

      font-family:
        system-ui,
        sans-serif;

      background:
        #f8fafc;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        100vh;

      margin: 0;

      padding: 20px;

    }

    .verify-card {

      background:
        #fff;

      padding:
        40px;

      border-radius:
        16px;

      max-width:
        500px;

      width:
        100%;

      text-align:
        center;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.08);

    }

    h1 {

      margin-bottom:
        10px;

    }

    p {

      color:
        #475569;

      line-height:
        1.6;

    }

    .success {

      color:
        #16a34a;

      font-weight:
        700;

    }

    .error {

      color:
        #dc2626;

      font-weight:
        700;

    }

  </style>

</head>

<body>

  <div class="verify-card">

    <h1>Email Verification</h1>

    <p id="verifyMessage">
      Verifying your email...
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-client.js"></script>

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const supabase =
          window.supabaseClient;

const params =
  new URLSearchParams(
    window.location.search
  );

const code =
  params.get("code");

if (code) {

  await supabase.auth.exchangeCodeForSession(
    code
  );

}

        const message =
          document.getElementById(
            "verifyMessage"
          );

        try {

      const {
  data: { session },
  error
} = await supabase.auth.getSession();

if (
  error ||
  !session?.user
) {

  message.textContent =
    "Invalid or expired verification link.";

  message.className =
    "error";

  return;

}

const user =
  session.user;

const {
  error: vendorError
} = await supabase
  .from("vendors")
  .update({
    email_verified: true
  })
  .eq(
    "auth_user_id",
    user.id
  );

if (vendorError) {

  message.textContent =
    "Unable to verify email.";

  message.className =
    "error";

  return;

}

message.textContent =
  "Your email has been verified successfully.";

message.className =
  "success";

  
        } catch (err) {

          console.error(err);

          message.textContent =
            "Verification failed.";

          message.className =
            "error";

        }

      }
    );

  </script>

</body>
</html>
