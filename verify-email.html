  <meta property="og:url" content="" id="ogUrl" />


  <!-- SEO placeholders -->
  <meta name="description" content="Discover verified vendors near you on Spotlight." />
  <link rel="canonical" href="https://www.spotlightdirectories.com/vendor-profile" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>  

  <style>

    body {

      font-family:
        system-ui,
        sans-serif;

      background:
        #f8fafc;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        100vh;

      margin: 0;

      padding: 20px;

    }

    .verify-card {

      background:
        #fff;

      padding:
        40px;

      border-radius:
        16px;

      max-width:
        500px;

      width:
        100%;

      text-align:
        center;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.08);

    }

    h1 {

      margin-bottom:
        10px;

    }

    p {

      color:
        #475569;

      line-height:
        1.6;

    }

    .success {

      color:
        #16a34a;

      font-weight:
        700;

    }

    .error {

      color:
        #dc2626;

      font-weight:
        700;

    }

  </style>

</head>

<body>

  <div class="verify-card">

    <h1>Email Verification</h1>

    <p id="verifyMessage">
      Verifying your email...
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-client.js"></script>

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const supabase =
          window.supabaseClient;

        // FIXED (2026-08-01): this page used to read `?code=` and call
        // exchangeCodeForSession — that's Supabase's native magic-link
        // flow, which has nothing to do with the custom one-time-token
        // system the "swift-task" edge function actually uses when a
        // vendor clicks "Verify Email". The email always links here with
        // `?token=<uuid>`, never `?code=`, so verification always failed
        // regardless of whether the token was valid. Now it reads
        // `?token=` and hands it to the verify-email-token edge function,
        // which validates it (expiry + single use) and flips
        // vendors.email_verified with the service role key — no logged-in
        // session required, since email links are often opened in a
        // different browser/device than the one the vendor is signed
        // into.
        const ERROR_MESSAGES = {
          missing_token: "This verification link is missing its token.",
          invalid: "Invalid or expired verification link.",
          used: "This verification link has already been used.",
          expired: "This verification link has expired. Please request a new one from your dashboard.",
        };

        const params =
          new URLSearchParams(
            window.location.search
          );

        const token =
          params.get("token");

        const message =
          document.getElementById(
            "verifyMessage"
          );

        if (!token) {

          message.textContent =
            "This verification link is missing its token.";

          message.className =
            "error";

          return;

        }

        try {

          const {
            data,
            error
          } = await supabase.functions.invoke(
            "verify-email-token",
            { body: { token } }
          );

          if (
            error ||
            !data?.success
          ) {

            message.textContent =
              (data && ERROR_MESSAGES[data.error]) ||
              "Invalid or expired verification link.";

            message.className =
              "error";

            return;

          }

          message.textContent =
            "Your email has been verified successfully.";

          message.className =
            "success";

          // Redirect owner back to dashboard
          setTimeout(() => {

            window.location.href =
              "vendordashboard.html";

          }, 1500);

        } catch (err) {

          console.error(err);

          message.textContent =
            "Verification failed.";

          message.className =
            "error";

        }

      }
    );

  </script>

</body>
</html>
