<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Service Details | Spotlight</title>
  <meta name="description" content="Find trusted local services on Spotlight Directories.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="vendor-service.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
  <link rel="apple-touch-icon" href="/images/favicon-180.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Spotlight Directories",
    "url": "https://spotlightdirectories.com",
    "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
  }
  </script>
</head>

<body>

<header class="navbar">
  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

  <nav>
    <button class="menu-open hide-desktop" aria-label="Open menu">
      <img src="images/hbopen.png" alt="Open menu" width="32" height="32">
    </button>

    <ul class="nav-links">
      <li class="menu-close">
        <button class="xclose" aria-label="Close menu">
          <img src="images/xclose.png" alt="Close menu" width="32" height="32">
        </button>
      </li>
      <li><a href="discover">Discover</a></li>
      <li><a href="getlisted">Get Listed</a></li>
      <li><a href="contact-us">Contact Us</a></li>
      <li id="authButton">
        <a href="login" id="authBtn" class="nav-login-btn">Log in</a>
      </li>
    </ul>
  </nav>
</header>

<main class="vs-page">

  <a id="backToVendor" class="vs-vendor-link">
    <i class="fa-solid fa-store"></i>
    View Vendor Profile
  </a>

  <div class="vs-container">

    <div class="vs-media">
      <div class="vs-image-wrap">
        <img id="productImage" alt="" class="vs-loading-img">
      </div>

      <div id="productThumbnails" class="vs-thumbnails">
        <img id="secondaryProductImage" class="vs-thumbnail hidden" alt="Secondary service image">
      </div>
    </div>

    <div class="vs-info">

      <h1 id="productTitle"></h1>

      <p id="productPrice" class="vs-price"></p>

      <div id="productVendorMeta" class="vs-vendor-meta"></div>

      <div id="productDescription" class="vs-description"></div>

      <div class="vs-actions">

        <a id="contactVendorBtn" class="vs-action-btn vs-whatsapp-btn" target="_blank">
          <span class="vs-btn-inner">
            <i class="fab fa-whatsapp"></i>
            <span>Chat Vendor</span>
          </span>
        </a>

        <a id="callVendorBtn" class="vs-action-btn vs-call-btn">
          <span class="vs-btn-inner">
            <i class="fas fa-phone"></i>
            <span>Call Vendor</span>
          </span>
        </a>

        <a id="shareProductBtn" class="vs-action-btn vs-share-btn">
          <span class="vs-btn-inner">
            <i class="fas fa-share-nodes"></i>
            <span>Share Service</span>
          </span>
        </a>

      </div>

    </div>

  </div>

  <section class="vs-more-section" style="display:none;">
    <h2>More Services From This Vendor</h2>
    <div id="moreProductsGrid" class="vs-card-grid"></div>
  </section>

  <section class="vs-similar-section" style="display:none;">
    <h2>Similar Services From Other Vendors</h2>
    <div id="similarProductsGrid" class="vs-card-grid"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="analytics-utils.js"></script>
<script src="vendor-service.js"></script>

</body>
</html>
