<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log In | Spotlight</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="auth.css">

<style>
  body { padding-top: 90px; }
</style>

<link rel="icon" href="images/favicon.ico" type="image/x-icon" />
</head>
<body>

<header class="navbar">
  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

  <nav>
    <button class="menu-open hide-desktop" aria-label="Open menu">
      <img src="images/hbopen.png" alt="Open menu" width="32" height="32">
    </button>

    <ul class="nav-links">
      <li class="menu-close">
        <button class="xclose" aria-label="Close menu">
          <img src="images/xclose.png" alt="Close menu" width="32" height="32">
        </button>
      </li>
      <li><a href="discover">Discover</a></li>
      <li><a href="contact-us">Contact Us</a></li>
      <li id="authButton">
        <a href="customer-signup" class="nav-login-btn">Sign up</a>
      </li>
    </ul>
  </nav>
</header>

<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Log in to see your favorite vendors and reviews.</p>
    </div>

    <div id="authError" class="auth-error"></div>

    <form id="customerLoginForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="primary-btn" id="loginBtn">Log In</button>

    </form>

    <p class="auth-footer">
      New here? <a href="customer-signup">Create an account</a>
    </p>

    <p class="auth-footer">
      Own a business? <a href="login">Log in as a vendor instead</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="customer-login.js"></script>
<script defer src="script2.js"></script>

</body>
</html>
