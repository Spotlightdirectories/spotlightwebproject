<div class="auth-card">
  <h2>Forgot your password?</h2>
  <p>Enter your email and we’ll send you a reset link.</p>

  <form id="forgotForm">
    <input
      type="email"
      id="email"
      placeholder="you@email.com"
      required
    />
    <button type="submit">Send reset link</button>
  </form>

  <p id="statusMsg" class="form-msg hidden"></p>
</div>
