<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Partner Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Reuse SAME admin CSS -->
  <link rel="stylesheet" href="./admin.css" />

  <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
</head>

<body>
  <main class="admin-container">
    
    <h1>My Commissions</h1>

    <!-- SUMMARY -->
    <table>
      <thead>
        <tr>
          <th>Pending</th>
          <th>Available</th>
          <th>Paid</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="pendingTotal">₦0</td>
          <td id="availableTotal">₦0</td>
          <td id="paidTotal">₦0</td>
        </tr>
      </tbody>
    </table>

    <!-- COMMISSION TABLE -->
    <h1 class="verification-heading">Commission History</h1>

    <table>
      <thead>
        <tr>
          <th>Vendor</th>
          <th>Plan</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="commissionTable">
        <tr>
          <td colspan="5">Loading…</td>
        </tr>
      </tbody>
    </table>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js"></script>
  <script src="partner-dashboard.js"></script>
</body>
</html>
