<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Vendor Account | Spotlight</title>

  <meta
    name="description"
    content="Create a vendor account on Spotlight to manage your business profile, media, and subscriptions."
  />
  
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="auth.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>

</head>

<body>
  <main class="auth-container">
    <section class="auth-card">

      <!-- HEADER -->
      <div class="auth-header">
        <h1>Create Vendor Account</h1>
        <p>Start managing your business on Spotlight</p>
      </div>

      <!-- SIGNUP FORM -->
      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="businessName">Business name</label>
          <input
            type="text"
            id="businessName"
            placeholder="Your business name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@business.com"
            required
          />
        </div>

    <div class="form-group">
  <label for="telephone">
    Telephone number
  </label>

  <input
    type="tel"
    id="telephone"
    placeholder="+2348021234567"
    required
  />
</div>

<div class="form-group">
  <label for="whatsapp">
    WhatsApp number
  </label>

  <input
    type="tel"
    id="whatsapp"
    value="+234"
    placeholder="+2348021234567"
    required
  />
</div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrap">
      <input
      type="password"
      id="password"
      placeholder="Create a password"
      required
      />
      <button type="button" class="toggle-password" data-target="password">👁</button>
      </div>
    </div>


        <div class="form-group">
    <label for="confirmPassword">Confirm password</label>
    <div class="password-wrap">
      <input
      type="password"
      id="confirmPassword"
      placeholder="Repeat your password"
      required
     />
    <button type="button" class="toggle-password" data-target="confirmPassword">👁</button>
    </div>
   </div>

<div class="form-group">
  <label class="checkbox-wrap">
    <input type="checkbox" id="agreeTerms" required>
    I agree to the 
    <a href="terms">Terms of Service</a>, 
    <a href="privacy">Privacy Policy</a>, and 
    <a href="disclaimer">Disclaimer</a>
  </label>
</div>

  <button type="submit" class="primary-btn" id="signupBtn">
  Create account
</button>

      </form>

      <!-- FEEDBACK -->
      <p id="signupError" class="form-error hidden"></p>

      <!-- FOOTER -->
      <div class="auth-footer">
        <p>
          Already have an account?
          <a href="login">Log in</a>
        </p>
      </div>

    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="signup.js"></script>
  <script defer src="script2.js"></script>

</body>
</html>
