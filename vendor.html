<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Vendors Near You | Spotlight</title>
  <meta name="description" content="Search and discover local vendors by category, location, and distance on Spotlight."/>
  <link rel="canonical" href="https://www.spotlightdirectories.com/vendor" />


  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="vendor.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>
  
</head>

<body>



    <main>

      <!-- 🔍 SEARCH & FILTER BAR -->
      <section class="search-section">
       <div class="search-header">
        <h1>Search Vendors</h1>
        <a href="index">Home</a>
       </div>

        <form id="searchForm">
          <label for="searchInput" class="visually-hidden">Search vendors</label>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by vendor name, category or sub-category"
          />

          <div class="filters">
            <label for="categorySelect" class="visually-hidden">Category</label>
            <select id="categorySelect" name="category">
              <option value="">All Categories</option>
            </select>

            <label for="subcategorySelect" class="visually-hidden">Subcategory</label>
            <select id="subcategorySelect" name="subcategory" disabled>
              <option value="">All Subcategories</option>
            </select>
          </div>

          <div class="location-toggle">
            <label>
              <input type="checkbox" id="locationToggle" />
              Enable location
            </label>
          </div>

          <p id="locationHint" class="hint hidden">
            Enable location to find vendors closest to you within 10km
          </p>

          <button type="submit">Search</button>
        </form>
      </section>

      <!-- 🧾 RESULTS -->
      <section class="results-section">
        <div id="resultsCount"></div>
        <div id="vendorsGrid" class="vendors-grid"></div>
      </section>

    </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="vendor.js" defer></script>
  <script defer src="script2.js"></script>
</body>
</html>
