<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Phone | Spotlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

<div class="auth-card">
  <h2>Verify your WhatsApp number</h2>

  <!-- STEP 1: Enter phone -->
  <form id="phoneForm">
    <input type="tel" id="phoneInput" placeholder="Enter WhatsApp number (e.g. 2348012345678)" required />
    <button type="submit">Send OTP</button>
  </form>

  <!-- STEP 2: Enter OTP -->
  <form id="otpForm" class="hidden">
    <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" required />
    <button type="submit">Verify OTP</button>
  </form>

  <p id="verifyMsg" class="form-msg hidden"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="verify-phone.js"></script>

</body>
</html>
