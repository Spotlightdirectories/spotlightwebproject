<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Phone | Spotlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="auth.css" />

  <!-- Scoped to this page only — auth.css is shared with
       login/signup/reset/forgot pages that have no navbar, so this
       clearance fix lives here instead of in the shared file. -->
  <style>
    body { padding-top: 90px; }
  </style>
  
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="images/favicon.png" />
</head>
<body>

<header class="navbar">
  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

  <nav>
    <button class="menu-open hide-desktop" aria-label="Open menu">
      <img src="images/hbopen.png" alt="Open menu" width="32" height="32">
    </button>

    <ul class="nav-links">
      <li class="menu-close">
        <button class="xclose" aria-label="Close menu">
          <img src="images/xclose.png" alt="Close menu" width="32" height="32">
        </button>
      </li>
      <li><a href="vendordashboard">Dashboard</a></li>
      <li><a href="discover">Discover</a></li>
      <li><a href="contact-us">Contact Us</a></li>
      <li id="authButton">
        <a href="login" id="authBtn" class="nav-login-btn">Log in</a>
      </li>
    </ul>
  </nav>
</header>

<div class="auth-card">
  <h2>Verify your phone number</h2>

  <!-- STEP 1: Enter phone -->
  <form id="phoneForm">
    <input type="tel" id="phoneInput" placeholder="Enter phone number (e.g. 2348012345678)" required />
    <button type="submit">Send OTP</button>
  </form>

  <!-- STEP 2: Enter OTP -->
  <form id="otpForm" class="hidden">
    <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" required />
    <button type="submit">Verify OTP</button>
  </form>

  <p id="verifyMsg" class="form-msg hidden"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="verify-phone.js"></script>
<script defer src="script2.js"></script>

</body>
</html>
