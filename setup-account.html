<!DOCTYPE html>
<html>
<head>
  <title>Create Your Login</title>
</head>
<body>

<h2>Create Your Username & Password</h2>

<input id="username" placeholder="Username"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button id="createBtn">Create Account</button>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://gyvzmktavyrevfxnwsay.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dnpta3RhdnlyZXZmeG53c2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5NjIyNzUsImV4cCI6MjA3NjUzODI3NX0.a5LnkYZb6IlTd2PEwD-M-Cw-hQSC8lKSU1uOEjgwjRo"
);

document.getElementById("createBtn").onclick = async function () {
  const params = new URLSearchParams(window.location.search);
  const vendorId = params.get("vendor_id");

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase
    .from("vendorUsers")
    .insert([
      {
        vendor_id: vendorId,
        username: username,
        password: password
      }
    ]);

  if (!error) {
    alert("Account created successfully!");
    window.location.href = "login.html";
  } else {
    alert("Unable to create login. Try again.");
  }
};
</script>

</body>
</html>
