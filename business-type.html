<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Select Business Type
</title>

<link
  rel="stylesheet"
  href="theme.css"
>

<link
  rel="stylesheet"
  href="navbar.css"
>

<link
  rel="stylesheet"
  href="business-type.css"
>

</head>

<body>

<header class="navbar">
  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

  <nav>
    <button class="menu-open hide-desktop" aria-label="Open menu">
      <img src="images/hbopen.png" alt="Open menu" width="32" height="32">
    </button>

    <ul class="nav-links">
      <li class="menu-close">
        <button class="xclose" aria-label="Close menu">
          <img src="images/xclose.png" alt="Close menu" width="32" height="32">
        </button>
      </li>
      <li><a href="vendordashboard">Dashboard</a></li>
      <li><a href="discover">Discover</a></li>
      <li><a href="contact-us">Contact Us</a></li>
      <li id="authButton">
        <a href="login" id="authBtn" class="nav-login-btn">Log in</a>
      </li>
    </ul>
  </nav>
</header>

<main class="bt-page">

  <div class="bt-card">

    <h1>
      Select Your Business Type
    </h1>

    <p>
      This choice determines how your dashboard is configured.
    </p>

    <label class="bt-option">

      <input
        type="radio"
        name="businessType"
        value="product"
      >

      <div>

        <strong>
          Product Business
        </strong>

        <span>
          Sell physical products.
        </span>

      </div>

    </label>

    <label class="bt-option">

      <input
        type="radio"
        name="businessType"
        value="service"
      >

      <div>

        <strong>
          Service Business
        </strong>

        <span>
          Provide professional or business services.
        </span>

      </div>

    </label>

    <label class="bt-option">

      <input
        type="radio"
        name="businessType"
        value="hybrid"
      >

      <div>

        <strong>
          Hybrid Business
        </strong>

        <span>
          Sell products and provide services.
        </span>

      </div>

    </label>

    <button
      id="businessTypeContinueBtn"
      type="button"
    >
      Continue
    </button>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script
  type="module"
  src="business-type.js"
></script>

<script defer src="script2.js"></script>

</body>
</html>
