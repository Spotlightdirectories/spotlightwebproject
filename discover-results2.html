<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>
    Search Results | Spotlight
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- SEO -->

  <meta
    name="description"
    content="Discover products, services and vendors on Spotlight."
  >

  <!-- FAVICONS -->

  <link
    rel="icon"
    type="image/png"
    sizes="48x48"
    href="/images/favicon-48.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="/images/favicon-64.png"
  >

  <link
    rel="apple-touch-icon"
    href="/images/favicon-180.png"
  >

  <!-- FONTAWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- PAGE CSS -->

  <link rel="stylesheet" href="discover-results2.css" >

  <link rel="stylesheet" href="reviews-utils.css" >

</head>

<body>

<!-- ========================= -->
<!-- DISCOVER RESULTS PAGE -->
<!-- ========================= -->

<!-- ========================= -->
<!-- DISCOVER RESULTS PAGE -->
<!-- ========================= -->

<main class="discover-results2-page">

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <header class="discover-results2-header">

    <button
      type="button"
      id="discoverResultsBackBtn"
      class="discover-results2-back-btn"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <a
      href="index.html"
      class="discover-results2-brand"
    >

      <img
        src="/images/spotlightlogo-512.png"
        alt="Spotlight"
        class="discover-results2-logo"
      >

      <span class="discover-results2-brand-text">
        Spotlight
      </span>

    </a>

  </header>

  <!-- ========================= -->
  <!-- SEARCH -->
  <!-- ========================= -->

  <section class="discover-results2-search-section">

  <div class="discover-results2-search-wrap">

  <i class="fa-solid fa-magnifying-glass"></i>

  <input
    type="text"
    id="discoverResultsSearchInput"
    class="discover-results2-search-input"
    placeholder="Search Spotlight"
    autocomplete="off"
  >

  <button
    type="button"
    id="discoverResultsSearchBtn"
    class="discover-results2-search-btn"
  >
    Search
  </button>

  </div>

  </section>

  <!-- ========================= -->
<!-- SEARCH TYPE -->
<!-- ========================= -->

<section class="discover-results2-search-tabs">

  <button
    type="button"
    class="discover-results2-tab active"
    data-type="all"
  >
    All
  </button>

  <button
    type="button"
    class="discover-results2-tab"
    data-type="product"
  >
    Product
  </button>

  <button
    type="button"
    class="discover-results2-tab"
    data-type="service"
  >
    Service
  </button>

  <button
    type="button"
    class="discover-results2-tab"
    data-type="vendor"
  >
    Vendor
  </button>

</section>

  <!-- ========================= -->
  <!-- FILTER BAR -->
  <!-- ========================= -->

<section class="discover-results2-filter-section">

  <!-- VERIFIED -->

  <label class="discover-results2-toggle-wrap">

    <input
      type="checkbox"
      id="discoverResultsVerifiedToggle"
    >

    <span class="discover-results2-toggle-slider"></span>

    <span class="discover-results2-toggle-label">

      Verified Only

    </span>

  </label>

  <!-- NEARBY -->

  <button
    type="button"
    id="discoverResultsNearbyBtn"
    class="discover-results2-nearby-btn"
  >

    <i class="fa-solid fa-location-dot"></i>

    Nearby

  </button>

  <!-- FILTERS -->

  <button
    type="button"
    id="discoverResultsFiltersBtn"
    class="discover-results2-filters-btn"
  >

    More Filters

    <i class="fa-solid fa-sliders"></i>

  </button>

</section>

  <!-- ========================= -->
  <!-- SEARCH SUMMARY -->
  <!-- ========================= -->

  <section class="discover-results2-summary-section">

    <p
      id="discoverResultsSummary"
      class="discover-results2-summary-text"
    ></p>

  </section>

  <!-- ========================= -->
  <!-- SPONSORED -->
  <!-- ========================= -->

  <section
    id="discoverResultsSponsoredSection"
    class="discover-results2-sponsored-section"
  >

    <div class="discover-results2-section-heading">

      <h2>
        Sponsored
      </h2>

    </div>

    <div
      id="discoverResultsSponsoredContainer"
      class="discover-results2-sponsored-scroll"
    ></div>

  </section>

  <!-- ========================= -->
  <!-- PRODUCTS -->
  <!-- ========================= -->

  <section
    id="discoverResultsProductsSection"
    class="discover-results2-products-section"
  >

    <div class="discover-results2-section-heading">

      <h2>
        Products
      </h2>

      <button
        type="button"
        id="discoverResultsProductsMoreBtn"
        class="discover-results2-more-btn"
      >
        See all
      </button>

    </div>

    <div
  class="discover-results2-products-carousel"
>

  <button
    type="button"
    id="discoverResultsProductsPrevBtn"
    class="discover-results2-carousel-arrow prev"
  >

    <i class="fa-solid fa-chevron-left"></i>

  </button>

  <div
    id="discoverResultsProductsGrid"
    class="discover-results2-products-grid"
  ></div>

     <button
      type="button"
      id="discoverResultsProductsNextBtn"
      class="discover-results2-carousel-arrow next"
     >

     <i class="fa-solid fa-chevron-right"></i>

    </button>

   </div>

  </section>

  <!-- ========================= -->
  <!-- SERVICES -->
  <!-- ========================= -->

<section
  id="discoverResultsServicesSection"
  class="discover-results2-services-section"
>

  <div class="discover-results2-section-heading">

    <h2>
      Services
    </h2>

    <button
      type="button"
      id="discoverResultsServicesMoreBtn"
      class="discover-results2-more-btn"
    >
      See all
    </button>

  </div>

  <div
    class="discover-results2-services-carousel"
  >

    <button
      type="button"
      id="discoverResultsServicesPrevBtn"
      class="discover-results2-carousel-arrow prev"
    >

      <i class="fa-solid fa-chevron-left"></i>

    </button>

    <div
      id="discoverResultsServicesList"
      class="discover-results2-services-list"
    ></div>

    <button
      type="button"
      id="discoverResultsServicesNextBtn"
      class="discover-results2-carousel-arrow next"
    >

      <i class="fa-solid fa-chevron-right"></i>

    </button>

  </div>

</section>

  <!-- ========================= -->
  <!-- VENDORS -->
  <!-- ========================= -->

  <section
    id="discoverResultsVendorsSection"
    class="discover-results2-vendors-section"
  >

    <div class="discover-results2-section-heading">

      <h2>
        Vendors
      </h2>

      <button
        type="button"
        id="discoverResultsVendorsMoreBtn"
        class="discover-results2-more-btn"
      >
        See all
      </button>

    </div>

    <div
      id="discoverResultsVendorsList"
      class="discover-results2-vendors-list"
    ></div>

  </section>

  <!-- ========================= -->
  <!-- EMPTY STATE -->
  <!-- ========================= -->

  <section
    id="discoverResultsEmptyState"
    class="discover-results2-empty-state"
  >

    <i class="fa-solid fa-magnifying-glass"></i>

    <h3>
      No Results Found
    </h3>

    <p>
      Try another keyword or adjust your filters.
    </p>

  </section>

  <!-- ========================= -->
  <!-- LOADING -->
  <!-- ========================= -->

  <div
    id="discoverResultsLoading"
    class="discover-results2-loading"
  >

    <div class="discover-results2-spinner"></div>

    <p>
      Discovering products, services and vendors...
    </p>

  </div>

  <!-- ========================= -->
<!-- MORE FILTERS DRAWER -->
<!-- ========================= -->

<aside
  id="discoverResultsFiltersDrawer"
  class="discover-results2-filters-drawer"
>

  <div class="discover-results2-filters-header">

    <h3>
      More Filters
    </h3>

    <button
      type="button"
      id="discoverResultsCloseFiltersBtn"
    >
      ×
    </button>

  </div>

  <div class="discover-results2-filters-body">

   <!-- ========================= -->
<!-- DISTANCE SEARCH -->
<!-- ========================= -->

<div class="discover-results2-distance-card">

  <div class="discover-results2-distance-top">

    <label class="discover-results2-distance-toggle">

      <input
        type="checkbox"
        id="discoverResultsEnableDistanceSearch"
      >

      <span class="discover-results2-distance-checkbox"></span>

      <span class="discover-results2-distance-text">
        Enable Distance Search
      </span>

    </label>

    <button
      type="button"
      id="discoverResultsUseLocationBtn"
      class="discover-results2-location-btn"
    >

      <i class="fa-solid fa-location-crosshairs"></i>

      Use Current

    </button>

  </div>

  <div class="discover-results2-distance-slider-wrap">

    <input
      type="range"
      id="discoverResultsRadiusSlider"
      class="discover-results2-distance-slider"
      min="1"
      max="20"
      value="5"
    >

    <div class="discover-results2-distance-scale">

      <span>
        0km
      </span>

      <span id="discoverResultsRadiusValue">
        5km
      </span>

      <span>
        20km
      </span>

    </div>

  </div>

</div>

    <div class="discover-results2-filter-group">

      <label for="discoverResultsCategory">
        Category
      </label>

      <select
        id="discoverResultsCategory"
        class="discover-results2-filter-select"
      >

        <option value="">
          Select Category
        </option>

      </select>

    </div>

    <div class="discover-results2-filter-group">

      <label for="discoverResultsSubcategory">
        Subcategory
      </label>

      <select
        id="discoverResultsSubcategory"
        class="discover-results2-filter-select"
      >

        <option value="">
          Select Subcategory
        </option>

      </select>

    </div>

    <div class="discover-results2-filter-group">

      <label for="discoverResultsState">
        State
      </label>

      <select
        id="discoverResultsState"
        class="discover-results2-filter-select"
      >

        <option value="">
          Select State
        </option>

      </select>

    </div>

    <div class="discover-results2-filter-group">

      <label for="discoverResultsLga">
        LGA
      </label>

      <select
        id="discoverResultsLga"
        class="discover-results2-filter-select"
      >

        <option value="">
          Select LGA
        </option>

      </select>

    </div>

  </div>

  <div class="discover-results2-filters-footer">

    <button
      type="button"
      id="discoverResultsResetFiltersBtn"
      class="discover-results2-reset-btn"
    >
      Reset
    </button>

    <button
      type="button"
      id="discoverResultsApplyFiltersBtn"
      class="discover-results2-apply-btn"
    >
      Apply Filters
    </button>

  </div>

</aside>

<!-- ========================= -->
<!-- DRAWER OVERLAY -->
<!-- ========================= -->

<div
  id="discoverResultsDrawerOverlay"
  class="discover-results2-drawer-overlay"
></div>

<!-- ========================= -->
<!-- MOBILE BOTTOM NAV -->
<!-- ========================= -->

<nav class="discover-results2-bottom-nav">

  <a
    href="index.html"
    class="discover-results2-bottom-item"
  >

    <i class="fa-solid fa-compass"></i>

    <span>
      Explore
    </span>

  </a>

  <button
    type="button"
    id="discoverResultsProfileNav"
    class="discover-results2-bottom-item"
  >

    <i class="fa-regular fa-user"></i>

    <span>
      Profile
    </span>

  </button>

</nav>

</main>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="supabase-client.js"></script>

<!-- PAGE JS -->

<script src="discover-config.js"></script>

<script src="badge-utils.js"></script>

<script src="nigeria-data.js"></script>

<script src="reviews-utils.js"></script>

<script src="discover-results2.js" defer></script>

</body>

</html>
