<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Login | Spotlight</title>

  <meta
    name="description"
    content="Log in to manage your vendor profile, uploads, and subscriptions on Spotlight."
  />
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="auth.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>  
  
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <h1 class="auth-title">Vendor Login</h1>
      <p class="auth-subtitle">Access your Spotlight dashboard</p>

      <div id="loginError" class="auth-error"></div>

      <form id="loginForm" class="auth-form">
        <div>
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@business.com"
            required
          />
        </div>

        <div>
          <label for="password">Password</label>
          <div class="password-wrap">
          <input type="password" id="password" placeholder="Your password" required/>
          <button type="button" class="toggle-password" data-target="password">👁</button>
       </div>
  </div>
      <button type="submit" class="auth-btn" id="loginBtn">Log in</button>
      </form>

      <p class="auth-link">
         <a href="forgot-password">Forgot password?</a>
     </p>

      <div class="auth-footer">
        Don’t have a vendor account?
        <a href="/getlisted.html">Get listed</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js" defer></script>
  <script defer src="script2.js"></script>
  

</body>

</html>
