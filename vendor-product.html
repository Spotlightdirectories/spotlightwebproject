<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details | Spotlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="vendor-product.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>

</head>

<body>

   <header class="navbar">

  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

 </header>


<main class="product-page">
 <a id="backToVendor" class="back-link">View Vendor Profile</a>

  <div class="product-container">

  <div class="product-media">

<div class="product-image-wrap">

  <img
    id="productImage"
    alt="Product image"
  >

</div>

<div
  id="productThumbnails"
  class="product-thumbnails"
>

  <img
    id="secondaryProductImage"
    class="thumbnail-image hidden"
    alt="Secondary product image"
  >

  <img
    id="tertiaryProductImage"
    class="thumbnail-image hidden"
    alt="Third product image"
  >

</div>

</div>

<div class="product-info">

  <h1 id="productTitle"></h1>

  <p
    id="productPrice"
    class="product-price"
  ></p>

  <div
    id="productVendorMeta"
    class="product-vendor-meta"
  ></div>

  <div
    id="productKeyDetails"
    class="product-key-details hidden"
  >

    <h3>
      Key Details
    </h3>

    <ul
      id="keyDetailsList"
    ></ul>

  </div>

  <p
    id="productDescription"
    class="product-description"
  ></p>

<div
  class="product-actions"
>

<a
  id="contactVendorBtn"
  class="action-btn whatsapp-btn"
  target="_blank"
>

  <span class="btn-inner">

    <i class="fab fa-whatsapp"></i>

    <span>Chat Vendor</span>

  </span>

</a>

<a
  id="callVendorBtn"
  class="action-btn call-btn"
>

  <span class="btn-inner">

    <i class="fas fa-phone"></i>

    <span>Call Vendor</span>

  </span>

</a>

<a
  id="shareProductBtn"
  class="action-btn share-btn"
>

  <span class="btn-inner">

    <i class="fas fa-share-nodes"></i>

    <span>Share Product</span>

  </span>

</a>

</div>

</div>

</div>

</div>

<section class="more-products">

  <h2>
    More Products From This Vendor
  </h2>

  <div
    id="moreProductsGrid"
    class="more-products-grid"
  ></div>

</section>

<section class="similar-products">

  <h2>

    Similar Products From Other Vendors

  </h2>

  <div
    id="similarProductsGrid"
    class="more-products-grid"
  ></div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="analytics-utils.js"></script>
<script src="vendor-product.js"></script>

</body>
</html>
