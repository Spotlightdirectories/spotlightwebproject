<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details | Spotlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="vendor-product.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ UPDATED FAVICONS -->
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">

<!-- ✅ STRUCTURED DATA (GOOGLE LOGO CONTROL) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Spotlight Directories",
  "url": "https://spotlightdirectories.com",
  "logo": "https://spotlightdirectories.com/images/spotlightlogo-512.png"
}
</script>

</head>

<body>

   <header class="navbar">

  <div class="logo-left">
    <a href="index">
      <img src="images/whitelogo3.png" alt="Spotlight Directories Logo" class="homeimg">
    </a>
    <a href="index" class="home">Home</a>
  </div>

 </header>


<main class="product-page">
 <a id="backToVendor" class="back-link">← Back to Vendor</a>

  <div class="product-container">

  <div class="product-media">

     <div class="product-image-wrap">
       <img id="productImage" alt="Product image">
     </div>

     <div id="productKeyDetails" class="product-key-details hidden">
      <h3>Key Details</h3>
      <ul id="keyDetailsList"></ul>
     </div>

   </div>

    <div class="product-info">

      <h1 id="productTitle"></h1>

      <p id="productPrice" class="product-price"></p>

      <div class="product-actions">
       <a id="contactVendorBtn" target="_blank">Chat Vendor on WhatsApp</a>
      </div>

      <p id="productDescription" class="product-description"></p>
    </div>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="vendor-product.js"></script>

</body>
</html>
