<div class="ob-container">
  <h2 class="ob-title">Vendor Onboarding</h2>

  <form id="vendorForm" class="ob-form" novalidate>

    <!-- Business Name -->
    <label class="ob-label">
      Business Name <span class="ob-req">*</span>
    </label>
    <input
      type="text"
      class="ob-input"
      id="name"
      placeholder="Enter your registered business name"
      required
    />

    <!-- Category -->
    <label class="ob-label" for="category">
      Category <span class="ob-req">*</span>
    </label>
      <select class="ob-select" id="category" required>
      <option value="">Select Category</option>
    </select>

    <!-- Subcategory -->
    <label class="ob-label" for="subcategory">
      Subcategory <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="subcategory" required>
      <option value="">Select Subcategory</option>
    </select>

    <!-- Address -->
    <label class="ob-label">
      Business Address <span class="ob-req">*</span>
    </label>
    <textarea
      class="ob-textarea"
      id="address"
      rows="2"
      placeholder="e.g., 12 Admiralty Way, Lekki Phase 1"
      required
    ></textarea>

    <!-- State -->
    <label class="ob-label" for="state">
      State <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="state" required>
      <option value="">Select State</option>
    </select>

    <!-- LGA -->
    <label class="ob-label" for="lga">
      LGA <span class="ob-req">*</span>
    </label>
    <select class="ob-select" name="lga" id="lga" required>
      <option value="">Select LGA</option>
    </select>

    <!-- Business Description -->
    <label class="ob-label">
     Business Description
    </label>
    <textarea class="ob-textarea" id="description" rows="4" placeholder="Briefly describe your services, experience, pricing style, specialties, etc.">
    </textarea>

    <!-- Coordinates -->
    <label class="ob-label">Business Coordinates</label>

    <p style="font-size:13px; color:#555; margin-bottom:10px;">
     Click "Detect My Business Location" while at your office or shop.
     If you are not there, you may manually enter coordinates.
    </p>

    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <input type="text" id="latitude" class="ob-input" placeholder="e.g. 6.5244" />
      <input type="text" id="longitude" class="ob-input" placeholder="e.g. 3.3792" />
    </div>

    <button type="button" id="detectLocationBtn" class="ob-btn secondary">
      Detect My Business Location
    </button>

    <div class="location-confirm">
      <input type="checkbox" id="confirmLocationCheckbox">
      <label for="confirmLocationCheckbox">
        I confirm this is my business location
      </label>
    </div>

    <div id="locationStatus" style="font-size:12px; color:#777; margin-bottom:10px;"></div>

    <!-- WhatsApp -->
    <label class="ob-label">
      WhatsApp Number <span class="ob-req">*</span>
    </label>
    <input type="tel" class="ob-input" id="whatsapp" placeholder="e.g., 08031234567" required />

    <!-- Telephone -->
    <label class="ob-label">
      Telephone Number (Optional)
    </label>
    <input type="tel" class="ob-input" id="telephone" placeholder="Optional — if different from WhatsApp" />

    <!-- Email -->
    <label class="ob-label">
      Email <span class="ob-req">*</span>
    </label>
    <input type="email" class="ob-input" id="email" placeholder="e.g., business@email.com" required />

    <!-- Submit -->
    <button type="submit" id="submitBtn" class="ob-btn primary">
      Submit
    </button>

  </form>

  <div id="statusMsg" class="status-message"></div>
</div>
