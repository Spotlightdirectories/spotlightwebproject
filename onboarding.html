<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Onboarding | Spotlight Directories</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/favicon.png" type="image/png">
</head>

<body>

<div class="ob-container">
  <h2 class="ob-title">Vendor Onboarding</h2>

  <form id="vendorForm" class="ob-form" novalidate>

    <!-- Business Name -->
    <label class="ob-label">
      Business Name <span class="ob-req">*</span>
    </label>
    <input
      type="text"
      class="ob-input"
      id="name"
      placeholder="Enter your business name"
      required
    />

    <!-- Category -->
    <label for="category"  class="ob-label">
      Category <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="category" required>
      <option value="">Select Category</option>
    </select>

    <!-- Subcategory -->
    <label for="subcategory" class="ob-label">
      Subcategory <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="subcategory" name="subcategory" required>
      <option value="" disabled selected>Select Subcategory</option>
    </select>

    <!-- Address -->
    <label class="ob-label">
      Business Address <span class="ob-req">*</span>
    </label>
    <textarea
      class="ob-textarea"
      id="address"
      rows="2"
      placeholder="Enter your business address"
      required
    ></textarea>

    <!-- State -->
    <label for="state" class="ob-label">
      State <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="state" required>
      <option value="">Select State</option>
    </select>

    <!-- LGA -->
    <label for="lga" class="ob-label">
      LGA <span class="ob-req">*</span>
    </label>
    <select class="ob-select" id="lga" required>
      <option value="">Select LGA</option>
    </select>

    <!-- Location Detection -->
    <label class="ob-label">
      Business Coordinates
    </label>

    <div style="display:flex; gap:10px; margin-bottom:10px;">
    <input type="text" id="latitude" class="ob-input" placeholder="Latitude" readonly />
    <input type="text" id="longitude" class="ob-input" placeholder="Longitude" readonly />
    </div>

    <button type="button" id="detectLocationBtn" class="ob-btn secondary">
      Detect My Business Location
    </button>

    <p id="locationStatus" style="font-size:12px; color:#777;">
      Click detect only if you are currently at your business location.
    </p>

    <!-- WhatsApp -->
<label class="ob-label">
  WhatsApp Number <span class="ob-req">*</span>
</label>
<input
  type="tel"
  class="ob-input"
  id="whatsapp"
  placeholder="e.g., 0803 123 4567"
  required
/>

<!-- Telephone -->
<label class="ob-label">
  Telephone Number (Optional)
</label>
<input
  type="tel"
  class="ob-input"
  id="telephone"
  placeholder="If different from WhatsApp"
/>


    <!-- Email -->
    <label class="ob-label">
      Email <span class="ob-req">*</span>
    </label>
    <input
      type="email"
      class="ob-input"
      id="email"
      placeholder="e.g., vendor@email.com"
      required
    />

    <!-- Submit -->
    <div class="ob-btn-group">
      <button type="submit" id="submitBtn" class="ob-btn primary">
        Submit
      </button>
    </div>

  </form>

  <div id="statusMsg" class="status-message"></div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="onboarding.js"></script>

</body>
</html>
