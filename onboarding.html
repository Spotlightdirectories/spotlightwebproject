<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Onboarding | Spotlight Directories</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/favicon.png" type="image/png">
</head>

<body>
<div class="ob-container">
  <h2 class="ob-title">Vendor Onboarding</h2>
  <p id="tierDisplay" class="ob-tier"></p>

  <form id="vendorForm" class="ob-form">
    <!-- Step 1 -->
    <div id="step1" class="ob-step">
      <label class="ob-label">Business Name<span class="ob-req">*</span></label>
      <input type="text" class="ob-input" id="name" placeholder="Enter your business name" required>

      <label class="ob-label">Category<span class="ob-req">*</span></label>
      <select class="ob-select" id="category" required>
        <option value="">Select Category</option>
        <option value="electronics">Electronics</option>
        <option value="fashion">Fashion</option>
        <option value="food">Food</option>
        <option value="furniture">Furniture</option>
        <option value="health">Health & Beauty</option>
        <option value="automobile">Automobile</option>
        <option value="services">Services</option>
      </select>

      <label class="ob-label">Business Address<span class="ob-req">*</span></label>
      <textarea class="ob-textarea" id="address" rows="2" placeholder="Enter your business address" required></textarea>

      <label class="ob-label" for="state">State</label>
      <select class="ob-select" id="state" required>
        <option value="">Select State</option>
      </select>

      <label class="ob-label" for="lga">LGA</label>
      <select class="ob-select" id="lga" required>
        <option value="">Select LGA</option>
      </select>

      <label class="ob-label">WhatsApp / Phone<span class="ob-req">*</span></label>
      <input type="tel" class="ob-input" id="phone" placeholder="e.g., 0803 123 4567" required>

      <label class="ob-label">Email<span class="ob-req">*</span></label>
      <input type="email" class="ob-input" id="email" placeholder="e.g., vendor@email.com" required>

      <div class="ob-btn-group">
        <button type="button" id="nextBtn" class="ob-btn primary">Next</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="ob-step ob-hidden">
      <h3>Subscription Plan</h3>
      <p>Your selected plan: <strong id="selectedTierText"></strong></p>

      <div id="paymentMethods" class="ob-payment ob-hidden">
        <p>Select preferred payment method:</p>
        <label><input type="radio" name="payment_method" value="Card"> Card</label>
        <label><input type="radio" name="payment_method" value="Bank Transfer"> Bank Transfer</label>
        <label><input type="radio" name="payment_method" value="USSD"> USSD</label>

        <div id="bankDetails" class="ob-hidden ob-bank-box">
          <p><strong>Bank Name:</strong> Union Bank</p>
          <p><strong>Account Name:</strong> Spotlight Directories Ltd</p>
          <p><strong>Account Number:</strong> 0123456789</p>
          <p><strong>Email for receipts:</strong> payments@spotlightdirectories.com</p>
        </div>
      </div>

      <div class="ob-btn-group">
        <button type="button" id="backBtn" class="ob-btn">Back</button>
        <button type="button" id="submitBtn" class="ob-btn primary">Submit</button>
      </div>
    </div>
  </form>
  
  <div id="statusMsg" class="status-message"></div>
  <div id="message" class="ob-hidden ob-message">
    <h3>Thank You!</h3>
    <p id="nextStepMessage"></p>
  </div>
</div>

<!-- JS -->
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <script src="script.js"></script>
     <script src="vendor.js"></script>

</body>
</html>
