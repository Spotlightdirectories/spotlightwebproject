<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="images/favicon.png" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-subtitle">Enter a new password below</p>

    <form id="resetForm" class="auth-form">

      <div class="password-wrap">
        <input 
          type="password" 
          id="newPassword" 
          placeholder="New password" 
          required 
        />
        <button type="button" class="toggle-password" data-target="newPassword">👁</button>
      </div>

      <div class="password-wrap">
        <input 
          type="password" 
          id="confirmPassword" 
          placeholder="Confirm password" 
          required 
        />
        <button type="button" class="toggle-password" data-target="confirmPassword">👁</button>
      </div>

      <button type="submit" class="auth-btn">
        Update password
      </button>

    </form>

    <p id="resetMsg" class="auth-error"></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
